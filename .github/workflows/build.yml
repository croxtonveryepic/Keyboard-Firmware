on: [push, pull_request, workflow_dispatch]

name: Build

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: adv360
            variant: legacy
            manifest: config/west.yml
            artifact: firmware-no-clique
          - keyboard: adv360
            variant: clique
            manifest: config/west.yml
            artifact: firmware-clique
          - keyboard: glove80
            variant: clique
            manifest: config/glove80/west.yml
            artifact: firmware-glove80
    name: Build (${{ matrix.keyboard }}, ${{ matrix.variant }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Glove80 keymap
        run: node bin/sync_glove80.mjs --check
      - name: Test keyboard mapping
        run: node --test bin/test/*.test.mjs
      - name: Verify saved comparison
        run: node visualizer/build-comparison.mjs --check
      - name: Test keymap visualizer
        run: node --test visualizer/test/*.test.mjs
      - name: Get version data
        run: bash bin/get_version.sh "$(echo "$GITHUB_REF_NAME" | cut -c1-4)" "$(echo "$GITHUB_SHA" | cut -c1-7)" "${{ matrix.variant }}"
      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-${{ matrix.keyboard }}-west-${{ hashFiles(matrix.manifest) }}
      - name: West Init
        run: |
          mkdir -p manifest-dir
          cp "${{ matrix.manifest }}" manifest-dir/west.yml
          west init -l manifest-dir
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      - name: Build firmware
        env:
          KEYBOARD: ${{ matrix.keyboard }}
          VARIANT: ${{ matrix.variant }}
          BUILD_RIGHT: 'true'
          COMMIT: ${{ github.sha }}
        run: |
          export COMMIT="${COMMIT:0:7}"
          bash bin/build.sh
      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: firmware/*.uf2
          if-no-files-found: error
